<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Русский язык с Екатериной</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,500;1,600;1,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: кабинет ученика в стиле канала — жёлтый фон, совушка в шапке, карточки с чёрной обводкой, большая кнопка урока, плитки, достижения, рейтинг, история */
:root{
  --bg:#FBEAA8;--surface:#FFFDF6;--ink:#2B2A28;--muted:#6F6650;--line:#E6D38C;
  --accent:#C9432E;--accent-soft:#FCE3D3;--coral:#E9705F;--lemon:#F4C430;--mint:#3E8F68;
  --sky1:#2B2A28;--sky2:#2B2A28;--skyink:#FBEAA8;--ok:#2F8A57;--bad:#C9432E;--soft:#FCE3D3;
  --f-d:"Lora",Georgia,"Times New Roman",serif;--f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
button{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- урок ---------- */
#bar{position:fixed;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
#bar .who{display:flex;align-items:center;gap:8px;min-width:0}
#bar .bo{width:30px;height:auto;flex:none}
#bar .who b{font-family:var(--f-d);font-style:italic;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.dot.on{background:var(--mint)}.dot.off{background:var(--bad)}
.st{font-size:.82rem;color:var(--muted)}
#where{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
#where b{color:var(--ink);font-weight:600}
.sp{flex:1}
.tb{font-weight:600;font-size:.85rem;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:6px 12px;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.tb[aria-pressed="true"]{background:var(--accent);color:#fff}
.tb.warn{border-color:var(--bad);color:var(--bad)}
.tb.quiet{border-color:var(--line);color:var(--muted)}
#frame{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;background:var(--bg)}
#msg{max-width:460px;margin:0 auto;padding:120px 20px 20px;text-align:center;display:grid;gap:14px}
#msg h1{font:800 1.3rem/1.3 var(--f-d);margin:0}
#msg button{font-weight:600;font-size:1rem;border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:#fff;cursor:pointer}
@media (max-width:640px){#where{max-width:60vw}.tb{padding:5px 9px;font-size:.8rem}#bar .lbl{display:none}}

#tour{position:fixed;inset:0;z-index:80;background:rgba(20,20,30,.55);display:grid;place-items:center;padding:16px}.tr-card{background:var(--surface);border-radius:22px;padding:24px 22px;max-width:400px;width:100%;display:grid;gap:10px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}.tr-ic{font-size:3rem;line-height:1}.tr-card h2{font:800 1.25rem/1.25 var(--f-d);margin:0}.tr-card p{margin:0;font-size:1rem;line-height:1.45}.tr-dots{display:flex;gap:6px;justify-content:center}.tr-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.tr-dots i.on{background:var(--accent)}.tr-row{display:flex;gap:10px;justify-content:space-between;margin-top:6px}.tr-b{flex:1;border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}.tr-b.q{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
/* ---------- кабинет ---------- */
#cab{max-width:860px;margin:0 auto;padding-bottom:48px}
.sky{position:relative;overflow:hidden;background:linear-gradient(155deg,var(--sky1) 0%,var(--sky2) 100%);color:var(--skyink);border-radius:0 0 28px 28px;padding:calc(26px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 26px max(18px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.9}
.hello{position:relative;display:flex;gap:16px;align-items:center}
.ava{flex:none;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid var(--lemon);display:grid;place-items:center;font-size:2.8rem;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.hello h1{font:800 clamp(1.35rem,5vw,1.9rem)/1.2 var(--f-d);margin:0;text-wrap:balance}
.lvl{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:var(--lemon);color:#1D1A47;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem}
.xp{position:relative;display:grid;gap:6px}
.xp-bar{height:14px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.xp-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lemon),var(--coral));width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.xp-t{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;opacity:.9;flex-wrap:wrap}
.xp-t b{font-variant-numeric:tabular-nums}
.inner{padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:grid;gap:22px;margin-top:-18px;position:relative}
.go{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 28px rgba(74,47,201,.18)}
.go .txt{flex:1 1 240px;min-width:0;display:grid;gap:2px}
.go .k{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.go .t{font:800 1.1rem/1.3 var(--f-d)}
.go button{border:0;border-radius:14px;padding:14px 22px;background:var(--coral);color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.go button:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.go.wait{border-color:var(--line);box-shadow:none}
.go.live button{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
h2{font:800 1.05rem/1.3 var(--f-d);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:2px}
.tile .n{font:800 1.6rem/1.1 var(--f-d);font-variant-numeric:tabular-nums}
.tile .l{font-size:.85rem;color:var(--muted)}
.tile.c1 .n{color:var(--accent)}.tile.c2 .n{color:var(--coral)}.tile.c3 .n{color:var(--mint)}.tile.c4 .n{color:#C98A00}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.a{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:4px;justify-items:center;text-align:center}
.a .i{font-size:2rem;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.a .t{font-weight:700;font-size:.9rem}
.a .d{font-size:.78rem;color:var(--muted)}
.a.off .i{filter:grayscale(1);opacity:.35}
.a.off .t{color:var(--muted)}
.a.on{border-color:var(--lemon);background:linear-gradient(var(--surface),var(--surface)) padding-box}
.bdg{display:flex;flex-wrap:wrap;gap:8px}
.bdg span{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;font-size:.88rem;font-weight:600}
.bdg i{font-style:normal;font-size:1.2rem;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bdg em{font-style:normal;color:var(--accent);font-size:.8rem}
.empty{color:var(--muted);font-size:.92rem;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px}
.board{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:36px 40px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .pl{font:800 1rem var(--f-d);text-align:center;color:var(--muted)}
.row.p1 .pl{color:#C98A00}.row.p2 .pl{color:#8A93A8}.row.p3 .pl{color:#B4683A}
.row .av{font-size:1.6rem;text-align:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.row .nm{min-width:0}
.row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:.8rem;color:var(--muted)}
.row .pt{font:800 1rem var(--f-d);font-variant-numeric:tabular-nums}
.row.me{background:var(--accent-soft)}
.row.gap{grid-template-columns:1fr;text-align:center;color:var(--muted);padding:4px}
.hwtop{background:#FFF4D6;border:3px solid #F2A900;border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 28px rgba(242,169,0,.25)}.hwtop .ic{font-size:2.4rem;line-height:1}.hwtop .txt{flex:1 1 220px;min-width:0;display:grid;gap:3px}.hwtop .k{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#8a6100;font-weight:800}.hwtop .t{font:800 1.1rem/1.3 var(--f-d)}.hwtop .s{font-size:.9rem;color:var(--muted)}.hwtop .hwbtn{flex:1 1 100%;text-align:center;text-decoration:none;border-radius:14px;padding:14px 22px;background:#F2A900;color:#222;font-weight:800;font-size:1.05rem;box-shadow:0 6px 0 rgba(0,0,0,.12)}@media(min-width:620px){.hwtop .hwbtn{flex:0 0 auto}}.hwl a .tt em{display:block;font-style:normal;font-size:.8rem;font-weight:600}.hwl a .tt em.ok{color:var(--ok)}.hwl a .tt em.no{color:var(--muted)}
.hwl{display:grid;gap:8px}.hwl a{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border:2px solid #f2a900;border-radius:14px;padding:12px 14px}.hwl a .tt{flex:1;min-width:0;font-weight:700}.hwl a .dt{color:var(--muted);font-size:.85rem;white-space:nowrap}.hwl a .op{background:#f2a900;color:#222;font-weight:700;border-radius:999px;padding:6px 12px;font-size:.88rem;white-space:nowrap}.hwl a.new{box-shadow:0 6px 18px rgba(242,169,0,.35)}
.hist{display:grid;gap:8px}
.h{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.h .tt{font-weight:600;min-width:0}
.h .dt{font-size:.8rem;color:var(--muted)}
.h .pc{font:800 1.1rem var(--f-d);font-variant-numeric:tabular-nums;text-align:right}
.h .pc.g{color:var(--ok)}.h .pc.m{color:#C98A00}.h .pc.b{color:var(--bad)}
.h .bb{grid-column:1/-1;font-size:1rem;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.foot{text-align:center;font-size:.85rem;color:var(--muted)}
.foot a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.xp-bar i{transition:none}.go.live button{animation:none}}

/* ---------- стиль канала: жёлтый фон, обводка, курсивный заголовок с засечками, совушка ---------- */
h1,h2,#msg h1{font-family:var(--f-d);font-style:italic;font-weight:700;letter-spacing:0}
h2{font-size:1.35rem}
#bar{border-bottom:2px solid var(--ink);background:var(--surface)}
.tb.quiet{border-color:var(--ink);color:var(--ink)}
.sky{background:transparent;color:var(--ink);border-radius:0;padding-bottom:18px}
.sky canvas{display:none}
.hello{padding-right:150px;min-height:120px}
.hello h1{font:italic 700 clamp(1.6rem,6vw,2.4rem)/1.15 var(--f-d)}
.hello h1 span{color:var(--accent)}
.owl{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:170px;height:auto;max-width:42vw}
@media (max-width:520px){.hello{padding-right:96px;min-height:104px}.owl{width:110px}.ava{width:64px;height:64px;font-size:2.1rem}}
.ava{background:var(--surface);border:2.5px solid var(--ink)}
.lvl{background:var(--ink);color:var(--lemon);font:italic 700 .95rem/1.4 var(--f-d);padding:4px 14px;white-space:nowrap}
.xp-bar{height:18px;background:var(--surface);border:2px solid var(--ink)}
.xp-bar i{background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--coral) 10px 20px)}
.xp-t{opacity:1;font-weight:600}
.inner{margin-top:0}
.go,.tile,.a,.board,.h,.empty{border:2px solid var(--ink);background:var(--surface);border-radius:14px}
.go{box-shadow:5px 5px 0 var(--ink)}
.go.wait{border-color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.go .k{color:var(--accent)}
.go .t{font:italic 700 1.3rem/1.25 var(--f-d)}
.go button{background:var(--accent);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--f)}
.go button:active{box-shadow:0 1px 0 var(--ink)}
.go img{width:92px;height:auto;flex:none}
.tile .n{font:italic 700 1.9rem/1.1 var(--f-d)}
.tile.c1 .n{color:var(--accent)}.tile.c2 .n{color:#C25A1E}.tile.c3 .n{color:var(--mint)}.tile.c4 .n{color:#A87A00}
.a.on{background:#FFF4CC;border-color:var(--ink)}
.a.off{border-style:dashed;border-color:#B9A66A}
.bdg span{border:2px solid var(--ink);background:var(--surface)}
.bdg em{color:var(--accent)}
.row{border-bottom:1.5px solid var(--line)}
.row.me{background:var(--accent-soft)}
.row .pt,.h .pc{font-family:var(--f-d);font-style:italic}
.empty{border-style:dashed}
.teach{display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px}
.teach img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2.5px solid var(--lemon);flex:none}
.teach div{display:grid;gap:2px;min-width:0}
.teach b{font:italic 700 1.15rem/1.25 var(--f-d);color:var(--lemon)}
.teach span{font-size:.88rem;opacity:.9}
.teach a{color:var(--bg);font-weight:700;word-break:break-all}

/* ---------- новый кабинет: шапка, герой, три плитки, путь, нижнее меню ---------- */
#cab{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.brand{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--bg);border-bottom:2px solid var(--ink)}
.brand img{width:40px;height:auto}
.brand span{display:grid;line-height:1.2;min-width:0}
.brand b{font:italic 700 1.1rem/1.2 var(--f-d)}
.brand em{font-style:normal;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inner{margin-top:16px;gap:18px}
.vt{font-size:1.6rem;margin:4px 0 0}
.muted{color:var(--muted)}.small{font-size:.88rem}
.hero{display:flex;gap:16px;align-items:center;background:var(--surface);border:2px solid var(--ink);border-radius:20px;padding:16px;box-shadow:5px 5px 0 var(--ink)}
.pet{flex:none;position:relative;width:96px;height:96px;border-radius:50%;border:2.5px solid var(--ink);background:var(--pc,#F4C430);cursor:pointer;display:grid;place-items:center;padding:0}
.pet span{font-size:3.2rem;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pet em{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font:700 .7rem/1 var(--f);font-style:normal;background:var(--ink);color:var(--lemon);border-radius:999px;padding:4px 8px;white-space:nowrap}
.hi{flex:1;min-width:0;display:grid;gap:8px}
.hi h1{font:italic 700 clamp(1.4rem,5.5vw,2rem)/1.15 var(--f-d);margin:0}
.hi h1 span{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fire{display:inline-flex;align-items:center;gap:4px;background:#FFE8D6;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.85rem}
.lvl{margin-top:0}
.xp{gap:4px}.xp-t{font-size:.8rem}
@media (max-width:420px){.hero{flex-direction:column;text-align:center}.chips{justify-content:center}.pet{width:88px;height:88px}}
.big3{display:grid;gap:12px}
@media (min-width:760px){.big3{grid-template-columns:repeat(3,1fr)}.big3 .tile{flex-direction:column;align-items:flex-start}.big3 .cta{align-self:stretch;text-align:center}}
.tile.big{display:flex;align-items:center;gap:12px;padding:16px;border:2px solid var(--ink);border-radius:18px;background:var(--surface);color:inherit;text-decoration:none;font:inherit;text-align:left;box-shadow:4px 4px 0 var(--ink);cursor:default;width:100%}
a.tile.big,button.tile.big{cursor:pointer}
a.tile.big:active,button.tile.big:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.tile.big .ic{font-size:2.2rem;line-height:1;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tile.big img{width:56px;flex:none}
.tile.big .tx{flex:1;min-width:0;display:grid;gap:2px}
.tile.big .tx b{font:italic 700 1.2rem/1.2 var(--f-d)}
.tile.big .tx span{font-size:.9rem;color:var(--muted)}
.tile.big .cta{flex:none;border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:800;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.tile.big .cta.q{background:var(--surface);color:var(--ink)}
.t-les.live{background:#FFF1EC}
.t-les.live .cta{animation:pulse 1.6s ease-in-out infinite}
.t-hw.live{background:#FFF4D6}.t-hw.live .cta{background:#F2A900;color:#222}
.t-err.live{background:#EAF6EF}.t-err.live .cta{background:var(--mint)}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h2{margin:0 0 10px}
.path{list-style:none;margin:0;padding:0;display:grid;gap:0}
.path li{display:flex;gap:12px;align-items:flex-start;position:relative;padding:0 0 14px}
.path li:not(:last-child)::before{content:"";position:absolute;left:15px;top:30px;bottom:0;width:3px;background:var(--line)}
.path li.done:not(:last-child)::before{background:var(--mint)}
.path i{flex:none;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.85rem;border:2px solid var(--line);background:var(--surface);color:var(--muted);position:relative;z-index:1}
.path li.done i{background:var(--mint);border-color:var(--mint);color:#fff}
.path li.now i{background:var(--lemon);border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 5px rgba(244,196,48,.35)}
.path span{padding-top:5px;line-height:1.35}
.path li.next span{color:var(--muted)}
.path li.now span{font-weight:800}
.path em{display:block;font-style:normal;font-size:.75rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.stat{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:14px;display:grid;gap:2px}

.stat.c1 .n{color:var(--accent)}.stat.c2 .n{color:#C25A1E}.stat.c3 .n{color:var(--mint)}.stat.c4 .n{color:#A87A00}

<body>
<div id="bar" hidden></div>
<div id="msg"><h1>Загружаю…</h1><p class="st">Подожди несколько секунд.</p></div>
<div id="cab" hidden></div>
<iframe id="frame" title="Рабочий лист" hidden></iframe>
<script>
(async function(){
  const $=s=>document.querySelector(s);const K=window.KIT,esc=K.esc;
  const P=new URLSearchParams(location.search);const sheetId=P.get('s'),stuId=P.get('u'),T=P.get('t')==='1';
  const msg=(h,p,btn)=>{const m=$('#msg');m.hidden=false;m.innerHTML='<h1>'+esc(h)+'</h1>'+(p?'<p class="st">'+esc(p)+'</p>':'');if(btn)m.appendChild(btn);};
  if(!sheetId&&!stuId){location.replace('admin.html');return;}
  firebase.initializeApp(window.FB_CONFIG);
  const auth=firebase.auth(),fdb=firebase.firestore(),FV=firebase.firestore.FieldValue;
  const user=await new Promise(r=>{const u=auth.onAuthStateChanged(x=>{u();r(x);});});
  const isAdmin=u=>u&&!u.isAnonymous&&(u.email||'').toLowerCase()===String(window.ADMIN_EMAIL).toLowerCase();
  if(T){
    if(!isAdmin(user)){
      const b=document.createElement('button');b.textContent='Войти через Google';
      b.onclick=async()=>{try{const r=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());if(isAdmin(r.user))location.reload();else msg('Это ссылка учителя','Войди под почтой администратора.',b);}catch(e){msg('Не получилось войти',String(e.message||e),b);}};
      msg('Вход для учителя','Войди, чтобы вести урок.',b);return;
    }
  }else if(!user){try{await auth.signInAnonymously();}catch(e){msg('Нет связи с сайтом','Проверь интернет и обнови страницу.');return;}}

  if(!sheetId){await cabinet(stuId);return;}
  await lesson();

  /* ================= КАБИНЕТ УЧЕНИКА ================= */
  async function cabinet(sid){
    const PETS=['🦉','🦊','🐼','🐯','🦁','🐨','🐸','🐙','🦄','🐲','🐬','🐝','🐧','🦖','🐱','🐶','🐰','🐻','🦋','🐢'];
    const COLORS=['#F4C430','#E9705F','#3E8F68','#4C7BD9','#9B5DE5','#2B2A28'];
    const short=t=>String(t||'Урок').replace(/^[^·]*·\s*/,'');
    const ref=fdb.collection('students').doc(sid);
    let stu;try{const s=await ref.get();if(!s.exists){msg('Страница не найдена','Проверь ссылку или попроси новую у учителя.');return;}stu=s.data();}
    catch(e){msg('Нет связи с сайтом','Проверь интернет и обнови страницу.');return;}
    document.title=(stu.name||'Мой кабинет')+' · Русский язык';
    const LS='cab-'+sid;let local={};try{local=JSON.parse(localStorage.getItem(LS)||'{}')||{};}catch(e){}
    const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(local));}catch(e){}};
    const me=()=>({avatar:local.avatar||stu.avatar||'🦉',color:local.color||stu.color||COLORS[0]});
    async function saveSelf(patch){Object.assign(local,patch);saveLocal();try{await ref.update(patch);}catch(e){}}
    let lessons=[],board=[],cur=null,first=true,program=null,errItems=null,view=(location.hash||'#home').slice(1);
    const hwState={};
    async function loadMore(){
      try{lessons=(await ref.collection('lessons').get()).docs.map(d=>Object.assign({id:d.id},d.data()));}catch(e){}
      try{board=(await fdb.collection('board').get()).docs.map(d=>Object.assign({id:d.id},d.data()));}catch(e){}
      const ids=lessons.filter(l=>!String(l.id).startsWith('m-')).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,15).map(l=>l.id);
      await Promise.all(ids.map(async id=>{try{const d=await fdb.collection('sheets').doc(id).collection('presence').doc('hw').get();hwState[id]=d.exists?{done:!!d.get('done'),at:d.get('at')||null}:{done:false};}catch(e){}}));
    }
    async function loadCur(){cur=null;if(stu.current){try{const s=await fdb.collection('sheets').doc(stu.current).get();if(s.exists)cur={id:s.id,title:s.get('title')||'Урок'};}catch(e){}}}
    async function loadProgram(){try{const r=await fetch('inbox/program.json?'+Date.now(),{cache:'no-store'});if(r.ok)program=await r.json();}catch(e){}}
    /* ошибки для тренажёра: из законченных уроков */
    const JUNK=/^(\?|ошибка в тетради|есть ошибки|верно|ничего|не знаю)$/i;
    async function loadErrors(){
      const ids=lessons.filter(l=>!String(l.id).startsWith('m-')).map(l=>l.id);const seen={};const out=[];
      await Promise.all(ids.map(async id=>{try{const q=await fdb.collection('sheets').doc(id).collection('attempts').get();
        const A=q.docs.map(d=>d.data()).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));const a=A[0];if(!a)return;
        (a.errors||[]).forEach(e=>{const q=String(e.q||'').trim(),g=String(e.given||'').trim(),r=String(e.right||'').trim();
          if(!q||!g||!r||JUNK.test(g)||JUNK.test(r)||g===r||r.length>70||g.length>70||/Проверка учителя|^Предложение \d+$/i.test(q))return;
          const k=(q+'|'+r).toLowerCase();if(seen[k])return;seen[k]=1;out.push({k,q,g,r,sec:e.section||''});});}catch(e){}}));
      errItems=out;
    }
    const tr=()=>Object.assign({},stu.trainer||{},local.trainer||{});
    const todo=()=>(errItems||[]).filter(x=>(tr()[hk(x.k)]||0)<3);
    function hk(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return 'h'+(h>>>0).toString(36);}
    function streak(){
      const L=lessons.filter(l=>!String(l.id).startsWith('m-')&&hwState[l.id]).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
      let n=0;for(let i=L.length-1;i>=0;i--){const h=hwState[L[i].id],nx=L[i+1];
        const at=typeof h.at==='number'?h.at:Date.parse(h.at||'');if(h.done&&(!nx||!at||at<=Date.parse(nx.date)+864e5))n++;else if(!h.done&&!nx)continue;else break;}
      return n;
    }
    await Promise.all([loadMore(),loadCur(),loadProgram()]);render();
    loadErrors().then(render);
    ref.onSnapshot(async s=>{if(first){first=false;return;}if(!s.exists)return;const old=stu.current,oldPts=(stu.stats||{}).points;stu=s.data();
      if(stu.current!==old)await loadCur();if((stu.stats||{}).points!==oldPts){await loadMore();loadErrors().then(render);}render();},()=>{});
    addEventListener('hashchange',()=>{view=(location.hash||'#home').slice(1);render();scrollTo(0,0);});

    function mapHtml(){
      if(!program)return '';const CU=(program.custom||{})[stu.key];const g=(String(stu.grade||'').match(/\d+/)||[''])[0];const T=CU?CU.topics:(program.grades&&program.grades[g]);if(!T)return '';
      const m=Object.assign({},(program.students||{})[stu.key]||{},stu.map||{});
      const done=T.filter((_,i)=>m[i]==='done').length;
      return '<section class="card"><div class="sec-h"><h2>'+(CU?esc(CU.title):'Мой путь в '+g+' классе')+'</h2><span class="muted">'+done+' из '+T.length+'</span></div><ol class="path">'+
        T.map((t,i)=>{const s=m[i]||'next';return '<li class="'+s+'"><i aria-hidden="true">'+(s==='done'?'✓':s==='now'?'★':i+1)+'</i><span>'+esc(t)+(s==='now'?'<em>сейчас изучаем</em>':'')+'</span></li>';}).join('')+'</ol></section>';
    }
    function render(){
      const st=stu.stats||K.aggregate([]);const lv=K.level(st.points||0);const M=me();
      const nm=stu.name||'';
      const lessonsSorted=lessons.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      const hwItems=lessonsSorted.filter(l=>!String(l.id).startsWith('m-'));
      const hwTop=hwItems.length&&hwState[hwItems[0].id]&&!hwState[hwItems[0].id].done?hwItems[0]:null;
      const curDone=!!(cur&&lessons.some(l=>l.id===cur.id));
      const sk=streak();const nErr=errItems?todo().length:null;
      const hero='<section class="hero" style="--pc:'+M.color+'"><button type="button" class="pet" id="petBtn" aria-label="Выбрать персонажа"><span>'+esc(M.avatar)+'</span><em>сменить</em></button>'+
        '<div class="hi"><h1>Привет, <span>'+esc(nm)+'</span>!</h1><div class="chips"><span class="lvl">'+lv.ic+' Уровень '+lv.n+' · '+esc(lv.name)+'</span>'+(sk?'<span class="fire">🔥 '+sk+' '+plural(sk,'домашка','домашки','домашек')+' подряд</span>':'')+'</div>'+
        '<div class="xp"><div class="xp-bar" role="progressbar" aria-valuenow="'+lv.pct+'" aria-valuemin="0" aria-valuemax="100" aria-label="До следующего уровня"><i id="xpi"></i></div><div class="xp-t"><span>Очки: <b>'+(st.points||0)+'</b></span><span>'+(lv.next?'До «'+esc(lv.next.name)+'»: <b>'+lv.toNext+'</b>':'Высший уровень!')+'</span></div></div></div></section>';
      const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const offToday=!!(stu.off||{})[dk(new Date())];
      let nextL=null;for(let i=0;i<21&&!nextL;i++){const d=new Date(Date.now()+i*864e5);const k=dk(d);if((stu.off||{})[k])continue;const t=(stu.extra||{})[k]||(stu.sched||{})[String(d.getDay())];if(t)nextL={d,t,i};}

          (x.sec?'<span class="tr-sec">'+esc(x.sec)+'</span>':'')+'<div class="tr-q">'+esc(x.q)+'</div><p class="muted small">Как правильно?</p><div class="tr-opts">'+opts.map(v=>'<button type="button" class="tr-o" data-v="'+esc(v)+'">'+esc(lab(v))+'</button>').join('')+'</div>'+

          const right=b.dataset.v===x.r;o.querySelectorAll('.tr-o').forEach(z=>{z.disabled=true;if(z.dataset.v===x.r)z.classList.add('ok');else if(z===b)z.classList.add('bad');});
          const t=Object.assign({},tr());const key=hk(x.k);t[key]=right?(t[key]||0)+1:0;if(right){ok++;if(t[key]>=3)won++;}
          const keys=Object.keys(t);if(keys.length>300)keys.slice(0,keys.length-300).forEach(k=>delete t[k]);

  /* ================= УРОК ================= */
  async function lesson(){
    const base=fdb.collection('sheets').doc(sheetId);
    let sheet;
    try{const s=await base.get();if(!s.exists){msg('Урок не найден','Проверь ссылку или попроси новую у учителя.');return;}sheet=s.data();}
    catch(e){msg('Нет связи с сайтом','Проверь интернет и обнови страницу.');return;}
    document.title=(sheet.title||'Урок')+(T?' · учитель':'');
    let stu=null;if(sheet.sid){try{const s=await fdb.collection('students').doc(sheet.sid).get();if(s.exists)stu=s.data();}catch(e){}}
    const session=sheet.sessionId||'main';
    const CID=Math.random().toString(36).slice(2,10);let n=0;
    const frame=$('#frame');
    let first=true,initial=[],ready=false,pend=[];
    const firstSnap=new Promise(res=>{
      base.collection('events').orderBy('at').onSnapshot(q=>{
        if(first){first=false;initial=q.docs.map(d=>d.data({serverTimestamps:'estimate'}));setConn(true);res();return;}
        q.docChanges().forEach(c=>{if(c.type!=='added')return;const ev=c.doc.data({serverTimestamps:'estimate'});if(ev.from===CID)return;
          if(ready)frame.contentWindow.__sync.apply(ev,false);else pend.push(ev);});
        setConn(true);
      },()=>{setConn(false);res();});
    });
    base.onSnapshot(s=>{const d=s.data();if(d&&(d.sessionId||'main')!==session)location.reload();},()=>{});
    const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;};
    window.__sheetAPI={
      mode:T?'t':'s',base,seed:hash(sheetId+session),attemptId:sheetId+'-'+session,started:sheet.sessionStarted||sheet.createdAt||new Date().toISOString(),
      badgeCounts:stu&&stu.stats?stu.stats.badges:null,
      emit:ev=>{base.collection('events').add(Object.assign(JSON.parse(JSON.stringify(ev)),{from:CID,n:++n,at:FV.serverTimestamp()})).catch(()=>setConn(false));},
      onFinish:T&&sheet.sid?finish:null,
      claudeReport:async extra=>{
        const [att,rev,imgs,ph,dn]=await Promise.all([base.collection('attempts').get(),base.collection('review').doc('next').get(),base.collection('teacherimgs').get(),base.collection('hwphotos').get().catch(()=>({docs:[]})),base.collection('presence').doc('hw').get().catch(()=>null)]);
        const L=['Отчёт для Claude. Ученик: '+(sheet.student||'')+'. Лист: '+(sheet.title||'')+' (id '+sheetId+')'];
        const A=att.docs.map(d=>d.data()).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
        if(!A.length)L.push('Результатов пока нет.');
        A.slice(0,1).forEach(a=>{const l=a.lesson||{solved:a.solved,total:a.total,correct:a.correct};
          L.push('','Урок '+(a.updatedAt||'').slice(0,16).replace('T',' ')+(a.finished?' · закончен':'')+': решено '+l.solved+' из '+l.total+', верно '+l.correct+'.');
          if(a.hidden&&a.hidden.length)L.push('Скрыто крестиком: '+a.hidden.join('; '));
          (a.errors||[]).forEach((e,i)=>L.push((i+1)+') ['+e.section+'] '+e.q+' — ответ: '+e.given+'; верно: '+e.right));
          if(a.blitz)L.push('Блиц: '+a.blitz.score+' очков, ответов '+a.blitz.answers+', точность '+a.blitz.acc+'%'+(a.blitz.mistakes&&a.blitz.mistakes.length?', ошибки: '+a.blitz.mistakes.join(', '):''));});
        if(extra&&extra.toHw&&extra.toHw.length)L.push('','Отправлено в ДЗ: '+extra.toHw.join('; '));
        if(extra&&extra.unsolved&&extra.unsolved.length)L.push('Не дошли (разделы без ответов): '+extra.unsolved.join('; '));
        const r=rev.exists?rev.data():null;if(r&&((r.topics||[]).length||r.note))L.push('','Повторить на следующем уроке: '+(r.topics||[]).join('; ')+(r.note?' · заметка: '+r.note:''));
        const I=imgs.docs.map(d=>d.data());if(I.length){L.push('','Свои задания картинкой:');I.forEach((d,i)=>L.push((i+1)+') ['+(d.sectionName||d.section)+'] '+(d.caption||'без подписи')+' · '+(d.check===true?'верно':d.check===false?'есть ошибки':'не проверено')+(d.note?' · ошибки: '+d.note:'')));}
        if(ph.docs&&ph.docs.length){const tp=ph.docs.filter(x=>x.data().task);const hp=ph.docs.length-tp.length;if(tp.length)L.push('','Фото из тетради на уроке: '+tp.length+' шт. ('+[...new Set(tp.map(x=>x.data().label||''))].filter(Boolean).join('; ')+')');if(hp)L.push('','Фото ДЗ прислано: '+hp+' шт.');}
        if(dn&&dn.exists&&dn.data().done)L.push('Ученик отметил, что ДЗ выполнено.');
        return L.join('\n');
      },
      ready:()=>{ready=true;const w=frame.contentWindow;initial.forEach(ev=>w.__sync.apply(ev,true));pend.forEach(ev=>w.__sync.apply(ev,false));pend=[];
        $('#msg').hidden=true;frame.hidden=false;fit();startPresence();}
    };
    async function finish(d,badges){
      const l=d.lesson||{solved:d.solved||0,correct:d.correct||0};const pct=l.solved?Math.round(l.correct/l.solved*100):0;
      const rec={title:sheet.title||'Урок',date:new Date().toISOString(),solved:l.solved||0,correct:l.correct||0,total:l.total||0,pct,badges:badges||[],perfect:!!(l.solved&&l.correct===l.solved&&l.solved>=10),hidden:d.hidden||[]};
      try{await fdb.collection('students').doc(sheet.sid).collection('lessons').doc(sheetId).set(JSON.parse(JSON.stringify(rec)));await K.recompute(fdb,sheet.sid);}catch(e){console.warn(e);alert('Итоги урока не сохранились: '+(e.message||e)+'. Сделай скриншот и пришли Claude.');}
    }
    await firstSnap;
    /* верхняя полоска */
    const bar=$('#bar');bar.hidden=false;
    if(T){
      bar.innerHTML='<span class="who"><span class="dot" id="peer" title="Ученик"></span><b></b></span><span id="where" class="st">Ученик ещё не открыл урок</span><span class="sp"></span>'+
        '<button type="button" class="tb" id="openall">▶ <span class="lbl">Открыть всё</span></button>'+
        '<button type="button" class="tb" id="findme">🔎 <span class="lbl">Где ученик</span></button>'+
        '<button type="button" class="tb" id="follow" aria-pressed="false">👀 <span class="lbl">Следить</span></button>'+
        '<button type="button" class="tb" id="call">📍 <span class="lbl">Позвать сюда</span></button>'+
        '<button type="button" class="tb quiet" id="reset">↺ <span class="lbl">Заново</span></button>'+
        '<a class="tb quiet" href="admin.html">Ученики</a><span class="dot" id="conn" title="Связь"></span>';
      bar.querySelector('.who b').textContent=(stu&&stu.name)||sheet.student||sheet.title||'';
    }else{
      bar.innerHTML=(sheet.sid?'<a class="tb quiet" href="index.html?u='+encodeURIComponent(sheet.sid)+'">← Кабинет</a>':'')+'<span class="who"><img class="bo" alt="" src="'+(window.IMG?IMG.owlHi:'')+'"><b></b></span><span class="sp"></span><button type="button" class="tb" id="help">❓ <span class="lbl">Как работать</span></button><span class="dot" id="conn"></span>';
      bar.querySelector('.who b').textContent=String(sheet.title||'').replace(/^[^·]*·\s*/,'');
      $('#help').onclick=()=>tour(0);
      let seen=false;try{seen=localStorage.getItem('tour1')==='1';}catch(e){}
      if(!seen)setTimeout(()=>tour(0),900);
    }
    function setConn(on){const d=$('#conn');if(d){d.className='dot '+(on?'on':'off');d.title=on?'Связь есть':'Нет связи';}}
    function fit(){const h=bar.offsetHeight;frame.style.top=h+'px';frame.style.height='calc(100% - '+h+'px)';}
    addEventListener('resize',fit);fit();setConn(true);
    /* лист */
    let bridge='';try{bridge=await (await fetch('bridge.js',{cache:'no-cache'})).text();}catch(e){msg('Не загрузился сайт','Обнови страницу.');return;}
    const RESET='<style>:root{color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>';
    frame.srcdoc='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1">'+RESET+'<script>'+bridge.replace(/<\/script/gi,'<\\/script')+'<\/script></head><body>'+sheet.html+'</body></html>';
    /* присутствие */
    function startPresence(){
      const me=base.collection('presence').doc(T?'t':'s');let last=null;const W=frame.contentWindow;
      const beat=()=>{const a=T?null:W.__sync.anchor();const ac=T?null:W.__sync.active();last=a+'|'+ac;me.set({at:FV.serverTimestamp(),anchor:a||null,act:ac||null}).catch(()=>{});};
      beat();setInterval(beat,15000);
      if(!T){let tm=null;const soon=()=>{clearTimeout(tm);tm=setTimeout(()=>{const k=W.__sync.anchor()+'|'+W.__sync.active();if(k!==last)beat();},600);};W.addEventListener('scroll',soon,{passive:true});W.__onAct=soon;return;}
      let follow=false,peer=null;const fb=$('#follow');
      const spot=()=>peer?(peer.act||peer.anchor):null;
      fb.onclick=()=>{follow=!follow;fb.setAttribute('aria-pressed',String(follow));if(follow&&spot())W.__sync.scrollTo(spot());};
      let allOpen=false;$('#openall').onclick=()=>{allOpen=!allOpen;W.__sync.openAll(allOpen);$('#openall .lbl').textContent=allOpen?'Закрыть всё':'Открыть всё';};
      $('#findme').onclick=()=>{const p=spot();if(p)W.__sync.scrollTo(p);else{const l=$('#findme .lbl');l.textContent='Ученика нет в листе';setTimeout(()=>{l.textContent='Где ученик';},1800);}};
      $('#call').onclick=()=>{const a=W.__sync.anchor();if(a!=null){window.__sheetAPI.emit({k:'goto',p:a});const l=$('#call .lbl');if(l){l.textContent='Позвала';setTimeout(()=>{l.textContent='Позвать сюда';},1500);}}};
      base.collection('presence').doc('s').onSnapshot(s=>{peer=s.data({serverTimestamps:'estimate'})||null;paint();if(follow&&spot())W.__sync.scrollTo(spot());},()=>{});
      function paint(){const at=peer&&peer.at&&peer.at.toMillis?peer.at.toMillis():0;const on=at&&Date.now()-at<45000;$('#peer').className='dot '+(on?'on':'');
        const sp=on?spot():null;const nm=(bar.querySelector('.who b').textContent||'Ученик').split(' ')[0];
        if(W.__sync.markPeer)W.__sync.markPeer(sp,'👀 '+nm+' здесь');
        const sec=sp?(W.__sync.describe?W.__sync.describe(sp):W.__sync.section(sp)):'';
        $('#where').innerHTML=on?(sec?'Сейчас: <b></b>':'Ученик в сети'):'Ученик не в сети';const b=$('#where b');if(b)b.textContent=sec;fit();}
      setInterval(paint,10000);
      let armed=false;const rb=$('#reset'),rl=rb.querySelector('.lbl');
      rb.onclick=async()=>{
        if(!armed){armed=true;rb.classList.add('warn');rl.textContent='Стереть ответы? Ещё раз';setTimeout(()=>{armed=false;rb.classList.remove('warn');rl.textContent='Заново';},4000);return;}
        rl.textContent='Стираю…';
        try{for(;;){const q=await base.collection('events').limit(400).get();if(q.empty)break;const b=fdb.batch();q.docs.forEach(d=>b.delete(d.ref));await b.commit();}
          await base.update({sessionId:'s'+Date.now().toString(36),sessionStarted:new Date().toISOString()});}
        catch(e){rl.textContent='Не получилось';}
      };
    }
  }
})();
</script>
</body>
