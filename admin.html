<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Мои ученики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,600;1,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: слева сетка карточек учеников, по нажатию — карточка ученика с уроком сегодня, прогрессом и листами */
:root{
  --bg:#FBEAA8;--surface:#FFFDF6;--ink:#2B2A28;--muted:#6F6650;--line:#E6D38C;
  --accent:#C9432E;--accent-soft:#FCE3D3;--coral:#E9705F;--lemon:#F4C430;--mint:#3E8F68;
  --sky1:#2B2A28;--sky2:#2B2A28;--skyink:#FBEAA8;--ok:#2F8A57;--bad:#C9432E;--soft:#FCE3D3;
  --f-d:"Lora",Georgia,"Times New Roman",serif;--f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
h1{font:800 1.45rem/1.2 var(--f-d);margin:0}
h2{font:800 1.05rem/1.3 var(--f-d);margin:0}
h3{font-size:1rem;margin:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted);font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:grid;gap:4px;font-size:.84rem;color:var(--muted);flex:1 1 180px;min-width:0}
input[type=text],select{color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:40px}
.b{font-size:.88rem;font-weight:600;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:7px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;white-space:nowrap}
.b.main{background:var(--accent);color:#fff}
.b.hot{background:var(--coral);border-color:var(--coral);color:#fff}
.b.warn{border-color:var(--bad);color:var(--bad)}
.b.quiet{border-color:var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:52px 1fr;gap:4px 12px;align-items:center;cursor:pointer;text-align:left;color:inherit;font:inherit}
.sc:hover{border-color:var(--accent)}
.sc .av{grid-row:span 2;width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:1.8rem;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.sc .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .meta{font-size:.82rem;color:var(--muted)}
.sc .now{grid-column:1/-1;font-size:.82rem;background:var(--soft);border-radius:8px;padding:4px 8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .now.no{background:transparent;color:var(--muted);padding:4px 0}
.add{border:2px dashed var(--line);background:transparent;justify-items:center;grid-template-columns:1fr;color:var(--muted);min-height:110px;align-content:center}
.head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.head .av{width:64px;height:64px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:2.2rem;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.today{border:2px solid var(--accent);background:var(--soft)}
.today .t{font-weight:700;font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 12px;display:grid}
.stats b{font:800 1.3rem/1.2 var(--f-d);font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.xp{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--lemon),var(--coral))}
.sh{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.sh.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.sh .tt{font-weight:600}
.pill{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--accent)}
.pill.g{background:rgba(31,138,91,.12);color:var(--ok)}.pill.r{background:rgba(214,58,69,.12);color:var(--bad)}
.res{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.86rem;white-space:pre-wrap;max-height:320px;overflow:auto;margin:0}
.link{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--bg);border-radius:8px;padding:6px 8px;word-break:break-all;user-select:all;flex:1 1 260px;min-width:0}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:1.3rem;cursor:pointer;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.avs button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.sw{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:10;max-width:calc(100vw - 32px)}
#login{text-align:center;max-width:420px;margin:60px auto 0}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem}

/* ---------- стиль канала ---------- */
h1,h2{font-family:var(--f-d);font-style:italic;font-weight:700}
h1{font-size:1.7rem}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand .me{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2.5px solid var(--ink);flex:none}
.brand .ow{width:58px;height:auto;flex:none}
.card,.sc,.sh{border:2px solid var(--ink);background:var(--surface)}
.card{box-shadow:4px 4px 0 var(--ink)}
.today{background:#FFF4CC}
.sc:hover{border-color:var(--accent)}
.sc .av,.head .av{background:var(--bg);border:2px solid var(--ink)}
.sc .now{background:var(--accent-soft)}
.add{border:2px dashed var(--ink);background:transparent;box-shadow:none}
.b.quiet{border-color:var(--ink);color:var(--ink)}
.b.hot{background:var(--accent);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.b.main{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stats div{background:var(--bg);border:1.5px solid var(--ink)}
.stats b{font-family:var(--f-d);font-style:italic}
.xp{border:2px solid var(--ink);height:14px;background:var(--surface)}
.xp i{background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--coral) 10px 20px)}
.sh.cur{box-shadow:inset 5px 0 0 var(--accent)}
.pill{background:var(--accent-soft);color:var(--accent)}
input[type=text],input[type=date],input[type=number],select{background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);border-radius:10px;padding:8px 10px;width:100%;min-height:40px;font:inherit}
@media (max-width:520px){.brand .ow{display:none}h1{font-size:1.4rem}}
.tday{border:2.5px solid var(--ink);background:#FFF4CC}
.tl{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.tday{grid-template-columns:minmax(0,1fr)}.tday>*{min-width:0}
.tday .tr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:10px 12px}
.tday .tm{font:italic 700 1.2rem/1 var(--f-d);min-width:56px}
.tday .av{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:1.5rem;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;flex:none}
.tday .ti{flex:1 1 220px;min-width:0}
.tday .tc{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--bg);border:1.5px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.g{background:#DFF5E3;border-color:var(--ok);color:var(--ok)}.chip.r{background:var(--accent-soft);border-color:var(--bad);color:var(--bad)}.chip.y{background:#FFF0B8;border-color:#C98A00;color:#7A5300}
.tday .ta{display:flex;gap:6px;flex-wrap:wrap}
.tmv{flex:1 1 100%}.lnk{font:inherit;border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0}
.sch{display:flex;flex-wrap:wrap;gap:8px}
.sd{display:flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:10px;padding:6px 8px;background:var(--surface)}
.sd input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.sd input[type=time]{border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;background:var(--bg);width:96px}

.libgo{font-size:1rem;padding:10px 18px}
.gch{display:flex;flex-wrap:wrap;gap:6px}
.chipb{font:inherit;font-size:.82rem;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;background:var(--surface);cursor:pointer}
.chipb.on{background:var(--ink);color:var(--bg)}
.fold{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 12px;padding-top:12px}
.fd{position:relative;display:grid;gap:4px;align-content:start;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:2px solid var(--ink);border-radius:0 16px 16px 16px;padding:18px 14px 14px;box-shadow:4px 4px 0 var(--ink);min-height:120px}
.fd::before{content:"";position:absolute;left:-2px;top:-12px;width:46%;height:12px;background:inherit;border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0}
.fd:hover{background:#FFF4CC}
.fd.empty{opacity:.55}
.fi{font-size:1.7rem;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.fn{font-weight:800;line-height:1.25}
.fc{font-size:.8rem;color:var(--muted)}
.lbl{display:grid;gap:10px}
.lb{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.lbt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.lbt b{font-size:1.02rem}
.tch{display:flex;flex-wrap:wrap;gap:6px}
.lbx{border-top:1.5px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.fchk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.mp{display:grid;gap:6px}
.mpr{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0}
.mst{font:inherit;font-size:.8rem;font-weight:700;border-radius:999px;padding:4px 12px;border:1.5px solid var(--ink);cursor:pointer;min-width:96px;background:var(--surface)}
.mst.now{background:var(--lemon)}.mst.done{background:var(--mint);color:#fff;border-color:var(--mint)}

</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand"><img class="me" id="meImg" alt="Екатерина"><h1 id="siteName">Мои ученики</h1><img class="ow" id="owImg" alt=""></span><span class="sp"></span><span class="muted" id="who"></span><button type="button" class="b quiet" id="logout" hidden>Выйти</button></div>
  <div id="login" class="card" hidden><h2>Вход для учителя</h2><p class="muted">Управлять уроками можно только с почты администратора.</p><div><button type="button" class="b main" id="loginBtn">Войти через Google</button></div><p class="muted" id="loginMsg"></p></div>
  <main id="app" hidden style="display:grid;gap:18px"></main>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script>
(function(){
  const $=s=>document.querySelector(s);const K=window.KIT,esc=K.esc;
  $('#siteName').textContent='Мои ученики';if(window.IMG){$('#meImg').src=IMG.teacher;$('#owImg').src=IMG.owlHi;}
  firebase.initializeApp(window.FB_CONFIG);
  const auth=firebase.auth(),fdb=firebase.firestore();try{fdb.settings({experimentalAutoDetectLongPolling:true,merge:true});}catch(e){}
  const isAdmin=u=>u&&!u.isAnonymous&&(u.email||'').toLowerCase()===String(window.ADMIN_EMAIL).toLowerCase();
  const site=location.href.replace(/admin\.html.*$/,'').replace(/[?#].*$/,'');
  let tT=null;const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tT);tT=setTimeout(()=>e.hidden=true,2400);};
  const inApp=/Telegram|FBAN|FBAV|Instagram|VKClient|\bwv\b|WhatsApp/i.test(navigator.userAgent);
  const hint='Похоже, сайт открыт внутри Telegram или другого приложения: там Google не даёт войти. Нажми «···» вверху справа → «Открыть в Safari» (или в Chrome) и войди там.';
  if(inApp)$('#loginMsg').textContent=hint;
  $('#loginBtn').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}catch(e){const c=e&&e.code||'';$('#loginMsg').textContent=/popup|web-storage|operation-not-supported/.test(c)?hint:'Не получилось войти: '+(e.message||e);}};
  $('#logout').onclick=()=>auth.signOut();
  auth.onAuthStateChanged(u=>{
    if(!isAdmin(u)){$('#app').hidden=true;$('#login').hidden=false;$('#logout').hidden=!u;$('#who').textContent=u&&!u.isAnonymous?u.email+' (не администратор)':'';return;}
    $('#login').hidden=true;$('#app').hidden=false;$('#logout').hidden=false;$('#who').textContent=u.email;$('#app').innerHTML='<p class="muted">Загружаю учеников…</p>';load().catch(e=>{$('#app').innerHTML='<div class="card"><h2>Не получилось загрузить учеников</h2><p class="muted">'+esc(String(e&&e.message||e))+'</p><p class="muted">Проверь интернет и нажми «Обновить». Если не помогает, пришли этот текст Claude.</p><div><button type="button" class="b main" onclick="location.reload()">Обновить</button></div></div>';});
  });
  let students=[],sheets=[],inbox=[],roster=[],open=null,program=null;
  const stuLink=s=>site+'index.html?u='+s.id, tchLink=id=>site+'index.html?s='+id+'&t=1', sheetLink=id=>site+'index.html?s='+id;
  function copy(text,msg){try{navigator.clipboard.writeText(text).then(()=>toast(msg||'Скопировано'),()=>prompt('Скопируй:',text));}catch(e){prompt('Скопируй:',text);}}
  async function load(){
    const [a,b]=await Promise.all([fdb.collection('students').get(),fdb.collection('sheets').orderBy('createdAt','desc').get()]);
    students=a.docs.map(d=>Object.assign({id:d.id},d.data())).sort((x,y)=>String(x.name).localeCompare(String(y.name),'ru'));
    sheets=b.docs.map(d=>({id:d.id,title:d.get('title'),student:d.get('student'),sid:d.get('sid')||null,src:d.get('src')||null,createdAt:d.get('createdAt'),topics:d.get('topics')||null}));
    try{const r=await fetch('inbox/list.json?'+Date.now(),{cache:'no-store'});inbox=r.ok?(await r.json()):[];}catch(e){inbox=[];}
    try{const r=await fetch('inbox/students.json?'+Date.now(),{cache:'no-store'});roster=r.ok?(await r.json()):[];}catch(e){roster=[];}
    try{const r=await fetch('inbox/program.json?'+Date.now(),{cache:'no-store'});program=r.ok?(await r.json()):null;}catch(e){program=null;}
    hwdone={};await Promise.all(students.filter(s=>s.current).map(async s=>{try{const d=await fdb.collection('sheets').doc(s.current).collection('presence').doc('hw').get();if(d.exists&&d.get('done'))hwdone[s.id]=d.data();}catch(e){}}));
    watchHw(); if(open)showStudent(open);else if(/^#lib/.test(location.hash))showLib(location.hash.split('/')[1]||null);else showList();
  }
  let hwdone={},hwWatch=[];
  const hwWhen=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  function watchHw(){hwWatch.forEach(u=>u());hwWatch=[];
    students.filter(s=>s.current).forEach(s=>{let first=true;hwWatch.push(fdb.collection('sheets').doc(s.current).collection('presence').doc('hw').onSnapshot(d=>{
      const v=d.exists?d.data():null;const was=hwdone[s.id];
      if(v&&v.done){hwdone[s.id]=v;if(!first&&(!was||was.at!==v.at)){toast(s.name+' сдал(а) домашнее задание');try{if(window.Notification&&Notification.permission==='granted')new Notification('ДЗ выполнено',{body:s.name+' отметил(а) домашнее задание'});}catch(e){}if(!open)showList();}}
      first=false;},()=>{}));});
    try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission();}catch(e){}
  }
  const sheetsOf=sid=>sheets.filter(s=>s.sid===sid);
  /* новые листы, которые Claude выложил в папку inbox */
  const stuOfItem=x=>(x.key&&students.find(s=>s.key===x.key))||null;
  const pending=()=>inbox.filter(x=>!sheets.some(s=>s.src===x.file)).filter(x=>{const st=stuOfItem(x);if(!st)return true;const t=Date.parse(x.added||'')||0;return !sheets.some(s=>s.sid===st.id&&(Date.parse(s.createdAt||'')||0)>t);});
  const norm=t=>String(t||'').trim().toLowerCase().replace(/ё/g,'е');
  const pendingFor=s=>pending().filter(x=>(x.key&&s.key)?x.key===s.key:norm(x.student)===norm(s.name));
  const gnum=g=>(String(g||'').match(/\d+/)||[''])[0];
  const findStu=r=>students.find(s=>s.key===r.key)||students.find(s=>!s.key&&norm(s.name)===norm(r.name)&&(!gnum(s.grade)||gnum(s.grade)===gnum(r.grade)));
  /* дубли: одно имя и тот же класс (или класс не указан) */
  function dupGroups(){const by={};students.forEach(x=>{(by[norm(x.name)]=by[norm(x.name)]||[]).push(x);});const out=[];
    Object.values(by).forEach(arr=>{if(arr.length<2)return;const gs={};arr.forEach(x=>{const g=gnum(x.grade);(gs[g]=gs[g]||[]).push(x);});const blank=gs['']||[];delete gs[''];const keys=Object.keys(gs);
      if(!keys.length){out.push(blank);return;}keys.forEach((g,i)=>{const grp=gs[g].concat(i===0?blank:[]);if(grp.length>1)out.push(grp);});});return out;}
  async function mergeInto(keep,others){const kr=fdb.collection('students').doc(keep.id);const upd={};
    for(const o of others){for(const sh of sheetsOf(o.id))await fdb.collection('sheets').doc(sh.id).update({sid:keep.id});
      const ls=await fdb.collection('students').doc(o.id).collection('lessons').get();for(const d of ls.docs)await kr.collection('lessons').doc(d.id).set(d.data());
      if(!keep.current&&!upd.current&&o.current)upd.current=o.current;if(!keep.key&&!upd.key&&o.key)upd.key=o.key;if(!keep.grade&&!upd.grade&&o.grade)upd.grade=o.grade;
      await clearColl(fdb.collection('students').doc(o.id).collection('lessons'));if(o.bid)await fdb.collection('board').doc(o.bid).delete().catch(()=>{});
      await fdb.collection('students').doc(o.id).delete();}
    if(Object.keys(upd).length)await kr.update(upd);await K.recompute(fdb,keep.id);}
  const missing=()=>roster.filter(r=>!findStu(r));
  async function importRoster(){
    const btn=$('#rosterGo');if(btn){btn.disabled=true;btn.textContent='Добавляю…';}
    let n=0;
    for(const r of roster){const ex=findStu(r);
      try{if(ex){if(!ex.key)await fdb.collection('students').doc(ex.id).update({key:r.key});continue;}
        const av=K.AVATARS[Math.floor(Math.random()*K.AVATARS.length)];

      const off=!!(s.off||{})[k];if((t||fresh)&&(all||!off))out.push({s,t:t||'',fresh,off});});

  /* ---------- карта программы ученика ---------- */
  const MST={next:'впереди',now:'сейчас',done:'пройдено'};

    box.querySelectorAll('.mst').forEach(b=>b.onclick=async()=>{const i=b.dataset.i;const cur=M.m[i]||'next';const nx=cur==='next'?'now':cur==='now'?'done':'next';M.m[i]=nx;

  /* ---------- итоги дня для Claude ---------- */
  async function dayReport(btn){
    const out=$('#dayOut');btn.disabled=true;btn.textContent='Собираю итоги…';
    const today=new Date();
    const sameDay=d=>{const x=new Date(d);return x.getFullYear()===today.getFullYear()&&x.getMonth()===today.getMonth()&&x.getDate()===today.getDate();};
    const want=new Map();
    await Promise.all(students.map(async s=>{try{const q=await fdb.collection('students').doc(s.id).collection('lessons').get();
      q.docs.forEach(d=>{const l=d.data();if(!d.id.startsWith('m-')&&l.date&&sameDay(l.date))want.set(d.id,s);});}catch(e){}}));
    todayList().forEach(x=>{if(x.s.current&&!want.has(x.s.current))want.set(x.s.current,x.s);});
    const parts=[];
    for(const [id,s] of want){const sh=sheets.find(z=>z.id===id);if(!sh)continue;
      try{const t=await summary(sh,s);if(/Результатов пока нет/.test(t))continue;
        const m=t.match(/\nУрок (\d{4}-\d\d-\d\d) (\d\d:\d\d)/);if(!m||!sameDay(m[1]+'T'+m[2]+':00Z'))continue;parts.push('Отчёт для Claude. '+t);}catch(e){}}
    btn.disabled=false;btn.textContent='📋 Итоги дня для Claude';
    if(!parts.length){out.hidden=false;out.textContent='За сегодня пока нет результатов уроков.';return;}
    const text='Итоги дня, '+today.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+'. Уроков: '+parts.length+'.\n\n'+parts.join('\n\n==========\n\n');
    out.hidden=false;out.textContent=text;copy(text,'Итоги дня скопированы ('+parts.length+'), вставь их Claude');
  }

  /* ---------- библиотека листов ---------- */
  let lib=null,libFolder=null,libQ='',libGrade='';
  async function loadLib(){if(lib)return lib;try{const r=await fetch('inbox/library.json?'+Date.now(),{cache:'no-store'});lib=r.ok?await r.json():{folders:[]};}catch(e){lib={folders:[]};}return lib;}
  const gradeOf=t=>{const m=String(t||'').match(/(\d)\s*кл/);return m?m[1]:'';};
  function libItems(){
    const stuBy=id=>students.find(s=>s.id===id);const inb={};inbox.forEach(x=>inb[x.file]=x);
    const map=new Map();
    sheets.forEach(sh=>{const st=stuBy(sh.sid);const it=inb[sh.src]||{};const key=sh.src||('t:'+short(sh.title).toLowerCase());
      const cur=map.get(key);const who=st?st.name:(sh.student||'');
      if(cur){if(who&&!cur.who.includes(who))cur.who.push(who);if(!cur.topics&&sh.topics)cur.topics=sh.topics;cur.ids.push(sh.id);return;}
      map.set(key,{key,kind:'sheet',id:sh.id,ids:[sh.id],title:short(sh.title),full:sh.title,note:it.note||'',who:who?[who]:[],grade:(st&&gradeOf(st.grade))||gradeOf(it.note)||'',date:sh.createdAt,topics:sh.topics||null,src:sh.src,student:sh.student});});

  async function libHtml(it){
    if(it.kind==='inbox'){const r=await fetch('inbox/'+encodeURIComponent(it.file)+'?'+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Файл не найден');return r.text();}
    const d=await fdb.collection('sheets').doc(it.id).get();if(!d.exists)throw new Error('Лист не найден');return d.get('html');
  }
  function rename(h,it,s){
    const old=String((it.full||'').split('·')[0]||it.student||'').trim();
    const dt=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
    h=h.replace(/<title>([^<]*)<\/title>/i,(m,t)=>{const p=t.split('·').map(x=>x.trim());if(p.length>=3)return '<title>'+s.name+' · Урок '+dt+' · '+p.slice(2).join(' · ')+'</title>';return '<title>'+s.name+' · '+t+'</title>';});
    if(old&&old!==s.name){const re=new RegExp('(^|[^А-Яа-яЁё])'+old.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![А-Яа-яЁё])','g');
      const i=h.indexOf('</title>');h=h.slice(0,i+8)+h.slice(i+8).replace(re,(m,p)=>p+s.name);}
    return h;
  }

  }
  function armed(btn,ask,fn){let on=false;const o=btn.textContent;btn.onclick=async()=>{if(!on){on=true;btn.classList.add('warn');btn.textContent=ask+' Нажми ещё раз';setTimeout(()=>{if(on){on=false;btn.classList.remove('warn');btn.textContent=o;}},4000);return;}
    on=false;btn.textContent='Выполняю…';try{await fn();toast('Готово');}catch(e){toast('Не получилось');}btn.textContent=o;btn.classList.remove('warn');};}
  async function clearColl(ref){for(;;){const q=await ref.limit(400).get();if(q.empty)return;const b=fdb.batch();q.docs.forEach(d=>b.delete(d.ref));await b.commit();}}
  async function summary(sh,s){
    const ref=fdb.collection('sheets').doc(sh.id);
    const [att,rev,imgs]=await Promise.all([ref.collection('attempts').get(),ref.collection('review').doc('next').get(),ref.collection('teacherimgs').get()]);
    const L=['Ученик: '+s.name+(s.grade?', '+s.grade:'')+'. Лист: '+sh.title+' (id '+sh.id+')'];
    const A=att.docs.map(d=>d.data()).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
    if(!A.length)L.push('Результатов пока нет.');
    A.slice(0,2).forEach(a=>{const l=a.lesson||{solved:a.solved,total:a.total,correct:a.correct};
      L.push('','Урок '+(a.updatedAt||'').slice(0,16).replace('T',' ')+(a.finished?' · закончен':'')+': решено '+l.solved+' из '+l.total+', верно '+l.correct+'.');
      if(a.hidden&&a.hidden.length)L.push('Скрыто учителем: '+a.hidden.join('; '));
      (a.errors||[]).forEach((e,i)=>L.push((i+1)+') ['+e.section+'] '+e.q+' — ответ: '+e.given+'; верно: '+e.right));
      if(a.timing&&a.timing.length)L.push('Время: '+a.timing.map(t=>t.section+' '+t.minutes+' мин').join('; '));
      if(a.blitz)L.push('Блиц: '+a.blitz.score+' очков, ответов '+a.blitz.answers+', точность '+a.blitz.acc+'%'+(a.blitz.mistakes&&a.blitz.mistakes.length?', ошибки: '+a.blitz.mistakes.join(', '):''));
      if(a.badges&&a.badges.length)L.push('Награды: '+a.badges.join(', '));});
    const r=rev.exists?rev.data():null;if(r&&((r.topics||[]).length||r.note))L.push('','Повторить на следующем уроке: '+(r.topics||[]).join('; ')+(r.note?' · заметка: '+r.note:''));
    const I=imgs.docs.map(d=>d.data());if(I.length){L.push('','Свои задания картинкой (пришли Claude скриншоты):');I.forEach((d,i)=>L.push((i+1)+') ['+(d.sectionName||d.section)+'] '+(d.caption||'без подписи')+' · '+(d.check===true?'верно':d.check===false?'есть ошибки':'не проверено')+(d.note?' · ошибки: '+d.note:'')));}
    return L.join('\n');
  }
})();
