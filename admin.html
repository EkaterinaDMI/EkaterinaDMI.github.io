<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Мои ученики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,600;1,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: слева сетка карточек учеников, по нажатию — карточка ученика с уроком сегодня, прогрессом и листами */
:root{
  --bg:#FBEAA8;--surface:#FFFDF6;--ink:#2B2A28;--muted:#6F6650;--line:#E6D38C;
  --accent:#C9432E;--accent-soft:#FCE3D3;--coral:#E9705F;--lemon:#F4C430;--mint:#3E8F68;
  --sky1:#2B2A28;--sky2:#2B2A28;--skyink:#FBEAA8;--ok:#2F8A57;--bad:#C9432E;--soft:#FCE3D3;
  --f-d:"Lora",Georgia,"Times New Roman",serif;--f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
h1{font:800 1.45rem/1.2 var(--f-d);margin:0}
h2{font:800 1.05rem/1.3 var(--f-d);margin:0}
h3{font-size:1rem;margin:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted);font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:grid;gap:4px;font-size:.84rem;color:var(--muted);flex:1 1 180px;min-width:0}
input[type=text],select{color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:40px}
.b{font-size:.88rem;font-weight:600;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:7px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;white-space:nowrap}
.b.main{background:var(--accent);color:#fff}
.b.hot{background:var(--coral);border-color:var(--coral);color:#fff}
.b.warn{border-color:var(--bad);color:var(--bad)}
.b.quiet{border-color:var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:52px 1fr;gap:4px 12px;align-items:center;cursor:pointer;text-align:left;color:inherit;font:inherit}
.sc:hover{border-color:var(--accent)}
.sc .av{grid-row:span 2;width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:1.8rem;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.sc .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .meta{font-size:.82rem;color:var(--muted)}
.sc .now{grid-column:1/-1;font-size:.82rem;background:var(--soft);border-radius:8px;padding:4px 8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .now.no{background:transparent;color:var(--muted);padding:4px 0}
.add{border:2px dashed var(--line);background:transparent;justify-items:center;grid-template-columns:1fr;color:var(--muted);min-height:110px;align-content:center}
.head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.head .av{width:64px;height:64px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:2.2rem;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.today{border:2px solid var(--accent);background:var(--soft)}
.today .t{font-weight:700;font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 12px;display:grid}
.stats b{font:800 1.3rem/1.2 var(--f-d);font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.xp{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--lemon),var(--coral))}
.sh{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.sh.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.sh .tt{font-weight:600}
.pill{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--accent)}
.pill.g{background:rgba(31,138,91,.12);color:var(--ok)}.pill.r{background:rgba(214,58,69,.12);color:var(--bad)}
.res{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.86rem;white-space:pre-wrap;max-height:320px;overflow:auto;margin:0}
.link{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--bg);border-radius:8px;padding:6px 8px;word-break:break-all;user-select:all;flex:1 1 260px;min-width:0}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:1.3rem;cursor:pointer;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.avs button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.sw{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:10;max-width:calc(100vw - 32px)}
#login{text-align:center;max-width:420px;margin:60px auto 0}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem}

/* ---------- стиль канала ---------- */
h1,h2{font-family:var(--f-d);font-style:italic;font-weight:700}
h1{font-size:1.7rem}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand .me{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2.5px solid var(--ink);flex:none}
.brand .ow{width:58px;height:auto;flex:none}
.card,.sc,.sh{border:2px solid var(--ink);background:var(--surface)}
.card{box-shadow:4px 4px 0 var(--ink)}
.today{background:#FFF4CC}
.sc:hover{border-color:var(--accent)}
.sc .av,.head .av{background:var(--bg);border:2px solid var(--ink)}
.sc .now{background:var(--accent-soft)}
.add{border:2px dashed var(--ink);background:transparent;box-shadow:none}
.b.quiet{border-color:var(--ink);color:var(--ink)}
.b.hot{background:var(--accent);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.b.main{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stats div{background:var(--bg);border:1.5px solid var(--ink)}
.stats b{font-family:var(--f-d);font-style:italic}
.xp{border:2px solid var(--ink);height:14px;background:var(--surface)}
.xp i{background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--coral) 10px 20px)}
.sh.cur{box-shadow:inset 5px 0 0 var(--accent)}
.pill{background:var(--accent-soft);color:var(--accent)}
input[type=text],select{background:var(--surface);border:1.5px solid var(--ink)}
@media (max-width:520px){.brand .ow{display:none}h1{font-size:1.4rem}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand"><img class="me" id="meImg" alt="Екатерина"><h1 id="siteName">Мои ученики</h1><img class="ow" id="owImg" alt=""></span><span class="sp"></span><span class="muted" id="who"></span><button type="button" class="b quiet" id="logout" hidden>Выйти</button></div>
  <div id="login" class="card" hidden><h2>Вход для учителя</h2><p class="muted">Управлять уроками можно только с почты администратора.</p><div><button type="button" class="b main" id="loginBtn">Войти через Google</button></div><p class="muted" id="loginMsg"></p></div>
  <main id="app" hidden style="display:grid;gap:18px"></main>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script>
(function(){
  const $=s=>document.querySelector(s);const K=window.KIT,esc=K.esc;
  $('#siteName').textContent='Мои ученики';if(window.IMG){$('#meImg').src=IMG.teacher;$('#owImg').src=IMG.owlHi;}
  firebase.initializeApp(window.FB_CONFIG);
  const auth=firebase.auth(),fdb=firebase.firestore();
  const isAdmin=u=>u&&!u.isAnonymous&&(u.email||'').toLowerCase()===String(window.ADMIN_EMAIL).toLowerCase();
  const site=location.href.replace(/admin\.html.*$/,'').replace(/[?#].*$/,'');
  let tT=null;const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tT);tT=setTimeout(()=>e.hidden=true,2400);};
  $('#loginBtn').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}catch(e){$('#loginMsg').textContent='Не получилось войти: '+(e.message||e);}};
  $('#logout').onclick=()=>auth.signOut();
  auth.onAuthStateChanged(u=>{
    if(!isAdmin(u)){$('#app').hidden=true;$('#login').hidden=false;$('#logout').hidden=!u;$('#who').textContent=u&&!u.isAnonymous?u.email+' (не администратор)':'';return;}
    $('#login').hidden=true;$('#app').hidden=false;$('#logout').hidden=false;$('#who').textContent=u.email;load();
  });
  let students=[],sheets=[],open=null;
  const stuLink=s=>site+'index.html?u='+s.id, tchLink=id=>site+'index.html?s='+id+'&t=1', sheetLink=id=>site+'index.html?s='+id;
  function copy(text,msg){try{navigator.clipboard.writeText(text).then(()=>toast(msg||'Скопировано'),()=>prompt('Скопируй:',text));}catch(e){prompt('Скопируй:',text);}}
  async function load(){
    const [a,b]=await Promise.all([fdb.collection('students').get(),fdb.collection('sheets').orderBy('createdAt','desc').get()]);
    students=a.docs.map(d=>Object.assign({id:d.id},d.data())).sort((x,y)=>String(x.name).localeCompare(String(y.name),'ru'));
    sheets=b.docs.map(d=>({id:d.id,title:d.get('title'),student:d.get('student'),sid:d.get('sid')||null,createdAt:d.get('createdAt')}));
    open?showStudent(open):showList();
  }
  const sheetsOf=sid=>sheets.filter(s=>s.sid===sid);
  const short=t=>String(t||'').replace(/^[^·]*·\s*/,'');

  /* ---------- список учеников ---------- */
  function showList(){
    open=null;history.replaceState(null,'',location.pathname);
    const free=sheets.filter(s=>!s.sid);
    $('#app').innerHTML='<div class="grid" id="grid"></div>'+(free.length?'<section class="card"><h2>Листы без ученика</h2><p class="muted">Привяжи лист к ученику, чтобы его результаты попадали в карточку.</p><div id="free" style="display:grid;gap:8px"></div></section>':'');
    const g=$('#grid');
    students.forEach(s=>{const st=s.stats||{};const lv=K.level(st.points||0);const cur=sheets.find(x=>x.id===s.current);
      const c=document.createElement('button');c.type='button';c.className='sc';
      c.innerHTML='<span class="av">'+esc(s.avatar||'🙂')+'</span><span class="nm">'+esc(s.name)+'</span><span class="meta">'+esc(s.grade||'')+(s.grade?' · ':'')+'ур. '+lv.n+' · '+(st.points||0)+' очк.</span>'+
        '<span class="now'+(cur?'':' no')+'">'+(cur?'Сегодня: '+esc(short(cur.title)):'Урок не выбран')+'</span>';
      c.onclick=()=>showStudent(s.id);g.appendChild(c);});
    const add=document.createElement('button');add.type='button';add.className='sc add';add.innerHTML='<b style="font-size:1.6rem">+</b><span>Добавить ученика</span>';add.onclick=()=>editStudent(null);g.appendChild(add);
    free.forEach(sh=>{const r=document.createElement('div');r.className='row';
      r.innerHTML='<span style="flex:1 1 200px;min-width:0">'+esc(sh.title)+'</span><select aria-label="Ученик"><option value="">Выбери ученика</option>'+students.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select><button type="button" class="b">Привязать</button>';
      r.querySelector('button').onclick=async()=>{const v=r.querySelector('select').value;if(!v)return toast('Выбери ученика');const s=students.find(x=>x.id===v);await fdb.collection('sheets').doc(sh.id).update({sid:v,student:s.name});toast('Лист привязан');load();};
      $('#free').appendChild(r);});
  }

  /* ---------- новый ученик / настройки ---------- */
  function editStudent(id){
    const s=id?students.find(x=>x.id===id):{name:'',grade:'',avatar:'🦊',inBoard:true};
    let av=s.avatar||'🦊';
    $('#app').innerHTML='<div class="row"><button type="button" class="b quiet" id="back">← Назад</button></div><section class="card"><h2>'+(id?'Настройки ученика':'Новый ученик')+'</h2>'+
      '<div class="row"><label class="f">Имя (его видят другие ученики в рейтинге)<input type="text" id="fName"></label><label class="f">Класс<input type="text" id="fGrade" placeholder="4 класс"></label></div>'+
      '<div class="f muted">Аватар</div><div class="avs" id="avs"></div>'+
      '<label class="sw"><input type="checkbox" id="fBoard"> Показывать в рейтинге учеников</label>'+
      '<div class="row"><button type="button" class="b main" id="save">Сохранить</button>'+(id?'<span class="sp"></span><button type="button" class="b warn" id="del">Удалить ученика</button>':'')+'</div></section>';
    $('#fName').value=s.name||'';$('#fGrade').value=s.grade||'';$('#fBoard').checked=s.inBoard!==false;
    K.AVATARS.forEach(a=>{const b=document.createElement('button');b.type='button';b.textContent=a;b.setAttribute('aria-pressed',String(a===av));b.onclick=()=>{av=a;$('#avs').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};$('#avs').appendChild(b);});
    $('#back').onclick=()=>id?showStudent(id):showList();
    $('#save').onclick=async()=>{const name=$('#fName').value.trim();if(!name)return toast('Впиши имя');
      const data={name,grade:$('#fGrade').value.trim(),avatar:av,inBoard:$('#fBoard').checked};
      try{let sid=id;if(id)await fdb.collection('students').doc(id).update(data);
        else{sid=K.rid(14);await fdb.collection('students').doc(sid).set(Object.assign(data,{bid:K.rid(10),current:null,createdAt:new Date().toISOString(),stats:K.aggregate([])}));}
        await K.recompute(fdb,sid);toast('Сохранено');open=sid;load();}catch(e){toast('Не сохранилось: '+(e.message||e));}};
    if(id)armed($('#del'),'Удалить ученика и его историю?',async()=>{
      const r=fdb.collection('students').doc(id);await clearColl(r.collection('lessons'));if(s.bid)await fdb.collection('board').doc(s.bid).delete().catch(()=>{});
      for(const sh of sheetsOf(id))await fdb.collection('sheets').doc(sh.id).update({sid:null});
      await r.delete();open=null;load();});
  }

  /* ---------- карточка ученика ---------- */
  async function showStudent(id){
    const s=students.find(x=>x.id===id);if(!s)return showList();open=id;
    const st=s.stats||K.aggregate([]);const lv=K.level(st.points||0);const list=sheetsOf(id);const cur=list.find(x=>x.id===s.current);
    let lessons={};try{(await fdb.collection('students').doc(id).collection('lessons').get()).docs.forEach(d=>lessons[d.id]=d.data());}catch(e){}
    $('#app').innerHTML='<div class="row"><button type="button" class="b quiet" id="back">← Все ученики</button></div>'+
      '<section class="card"><div class="head"><span class="av">'+esc(s.avatar||'🙂')+'</span><div style="flex:1;min-width:0"><h2>'+esc(s.name)+'</h2><span class="muted">'+esc(s.grade||'')+(s.grade?' · ':'')+lv.ic+' уровень '+lv.n+' · '+esc(lv.name)+'</span></div><button type="button" class="b quiet" id="edit">Настройки</button></div>'+
        '<div class="xp" aria-hidden="true"><i style="width:'+lv.pct+'%"></i></div>'+
        '<div class="stats"><div><b>'+(st.points||0)+'</b><span>очков</span></div><div><b>'+(st.lessons||0)+'</b><span>уроков</span></div><div><b>'+(st.accuracy||0)+'%</b><span>точность</span></div><div><b>'+(st.nbadges||0)+'</b><span>наград</span></div><div><b>'+(st.achievements||[]).length+' из '+K.ACH.length+'</b><span>достижений</span></div></div>'+
        '<div class="row"><span class="muted">Ссылка ученика на весь год:</span></div><div class="row"><span class="link">'+esc(stuLink(s))+'</span><button type="button" class="b" id="cpStu">Скопировать</button><a class="b quiet" href="'+esc(stuLink(s))+'" target="_blank" rel="noopener">Как видит ученик</a></div></section>'+
      '<section class="card today"><h3>Урок сегодня</h3>'+(cur?'<span class="t">'+esc(short(cur.title))+'</span><div class="row"><a class="b hot" href="'+esc(tchLink(cur.id))+'" target="_blank" rel="noopener">▶ Начать урок</a><button type="button" class="b quiet" id="unset">Убрать из кабинета</button></div><span class="muted">Ученик видит кнопку «Начать урок» у себя в кабинете.</span>'
        :'<span class="muted">Урок не выбран. Добавь лист ниже или нажми «Сделать уроком сегодня» у готового листа.</span>')+'</section>'+
      '<section class="card"><h3>Добавить лист</h3><span class="muted">Файл листа «для сайта» от Claude. Он сразу станет уроком сегодня.</span><div class="row"><input type="file" id="file" accept=".html,text/html"><button type="button" class="b main" id="addSheet">Добавить</button></div><span class="muted" id="addMsg"></span></section>'+
      '<section class="card"><h3>Листы и итоги</h3><div id="sheets" style="display:grid;gap:10px"></div></section>';
    $('#back').onclick=showList;$('#edit').onclick=()=>editStudent(id);$('#cpStu').onclick=()=>copy(stuLink(s),'Ссылка ученика скопирована');
    const un=$('#unset');if(un)un.onclick=async()=>{await fdb.collection('students').doc(id).update({current:null});load();};
    $('#addSheet').onclick=async()=>{const f=$('#file').files[0];if(!f)return toast('Сначала выбери файл');const html=await f.text();
      if(!/window\.__ATTEMPT_ID/.test(html))return $('#addMsg').textContent='Это лист не для сайта. Попроси у Claude версию «для сайта».';
      if(new Blob([html]).size>1000000)return $('#addMsg').textContent='Файл слишком большой для сайта.';
      const m=html.match(/<title>([^<]*)<\/title>/i);const sid=K.rid(12);$('#addMsg').textContent='Сохраняю…';
      try{await fdb.collection('sheets').doc(sid).set({title:m?m[1].trim():'Урок',student:s.name,sid:id,html,createdAt:new Date().toISOString(),sessionId:'main'});
        await fdb.collection('students').doc(id).update({current:sid});toast('Лист добавлен, это урок сегодня');load();}catch(e){$('#addMsg').textContent='Не сохранилось: '+(e.message||e);}};
    const box=$('#sheets');
    if(!list.length)box.innerHTML='<p class="muted">Листов пока нет.</p>';
    list.forEach(sh=>{const l=lessons[sh.id];const c=document.createElement('div');c.className='sh'+(sh.id===s.current?' cur':'');
      c.innerHTML='<div class="row"><span class="tt" style="flex:1;min-width:0">'+esc(short(sh.title))+'</span>'+(sh.id===s.current?'<span class="pill">сегодня</span>':'')+(l?'<span class="pill '+(l.pct>=85?'g':l.pct<60?'r':'')+'">'+l.pct+'% · '+l.correct+' из '+l.solved+'</span>':'<span class="muted">не пройден</span>')+'<span class="muted">'+K.fmtDate(sh.createdAt)+'</span></div>'+
        '<div class="row"><a class="b" href="'+esc(tchLink(sh.id))+'" target="_blank" rel="noopener">Открыть урок</a>'+(sh.id!==s.current?'<button type="button" class="b" data-a="cur">Сделать уроком сегодня</button>':'')+'<button type="button" class="b" data-a="claude">Итоги для Claude</button><button type="button" class="b quiet" data-a="reset">Сбросить ответы</button><button type="button" class="b quiet" data-a="del">Удалить</button></div><pre class="res" hidden></pre>';
      const out=c.querySelector('.res');
      const bc=c.querySelector('[data-a=cur]');if(bc)bc.onclick=async()=>{await fdb.collection('students').doc(id).update({current:sh.id});toast('Это урок сегодня');load();};
      c.querySelector('[data-a=claude]').onclick=async()=>{const t=await summary(sh,s);out.hidden=false;out.textContent=t;copy(t,'Итоги скопированы, вставь их Claude');};
      armed(c.querySelector('[data-a=reset]'),'Стереть ответы урока?',async()=>{await clearColl(fdb.collection('sheets').doc(sh.id).collection('events'));await fdb.collection('sheets').doc(sh.id).update({sessionId:'s'+Date.now().toString(36),sessionStarted:new Date().toISOString()});});
      armed(c.querySelector('[data-a=del]'),'Удалить лист навсегда?',async()=>{const r=fdb.collection('sheets').doc(sh.id);for(const k of ['events','attempts','review','teacherimgs','blobs','presence'])await clearColl(r.collection(k));await r.delete();
        await fdb.collection('students').doc(id).collection('lessons').doc(sh.id).delete().catch(()=>{});if(s.current===sh.id)await fdb.collection('students').doc(id).update({current:null});await K.recompute(fdb,id);load();});
      box.appendChild(c);});
  }
  function armed(btn,ask,fn){let on=false;const o=btn.textContent;btn.onclick=async()=>{if(!on){on=true;btn.classList.add('warn');btn.textContent=ask+' Нажми ещё раз';setTimeout(()=>{if(on){on=false;btn.classList.remove('warn');btn.textContent=o;}},4000);return;}
    on=false;btn.textContent='Выполняю…';try{await fn();toast('Готово');}catch(e){toast('Не получилось');}btn.textContent=o;btn.classList.remove('warn');};}
  async function clearColl(ref){for(;;){const q=await ref.limit(400).get();if(q.empty)return;const b=fdb.batch();q.docs.forEach(d=>b.delete(d.ref));await b.commit();}}
  async function summary(sh,s){
    const ref=fdb.collection('sheets').doc(sh.id);
    const [att,rev,imgs]=await Promise.all([ref.collection('attempts').get(),ref.collection('review').doc('next').get(),ref.collection('teacherimgs').get()]);
    const L=['Ученик: '+s.name+(s.grade?', '+s.grade:'')+'. Лист: '+sh.title+' (id '+sh.id+')'];
    const A=att.docs.map(d=>d.data()).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
    if(!A.length)L.push('Результатов пока нет.');
    A.slice(0,2).forEach(a=>{const l=a.lesson||{solved:a.solved,total:a.total,correct:a.correct};
      L.push('','Урок '+(a.updatedAt||'').slice(0,16).replace('T',' ')+(a.finished?' · закончен':'')+': решено '+l.solved+' из '+l.total+', верно '+l.correct+'.');
      if(a.hidden&&a.hidden.length)L.push('Скрыто учителем: '+a.hidden.join('; '));
      (a.errors||[]).forEach((e,i)=>L.push((i+1)+') ['+e.section+'] '+e.q+' — ответ: '+e.given+'; верно: '+e.right));
      if(a.timing&&a.timing.length)L.push('Время: '+a.timing.map(t=>t.section+' '+t.minutes+' мин').join('; '));
      if(a.blitz)L.push('Блиц: '+a.blitz.score+' очков, ответов '+a.blitz.answers+', точность '+a.blitz.acc+'%'+(a.blitz.mistakes&&a.blitz.mistakes.length?', ошибки: '+a.blitz.mistakes.join(', '):''));
      if(a.badges&&a.badges.length)L.push('Награды: '+a.badges.join(', '));});
    const r=rev.exists?rev.data():null;if(r&&((r.topics||[]).length||r.note))L.push('','Повторить на следующем уроке: '+(r.topics||[]).join('; ')+(r.note?' · заметка: '+r.note:''));
    const I=imgs.docs.map(d=>d.data());if(I.length){L.push('','Свои задания картинкой (пришли Claude скриншоты):');I.forEach((d,i)=>L.push((i+1)+') ['+(d.sectionName||d.section)+'] '+(d.caption||'без подписи')+' · '+(d.check===true?'верно':d.check===false?'есть ошибки':'не проверено')+(d.note?' · ошибки: '+d.note:'')));}
    return L.join('\n');
  }
})();
</script>
